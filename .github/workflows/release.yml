name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:                 # 新增：带参数的按钮，给总控远程调用
    inputs:
      version:
        description: "版本号，例如 v0.4.0"
        required: true

env:
  TAG: ${{ inputs.version || github.ref_name }}   # 点按钮时用输入的版本号，推 tag 时用 tag 名

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检查版本号格式                        # 新增：9b 里会故意让它失败
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式错误：$TAG"
            exit 1
          fi
      - uses: actions/checkout@v4
      - run: |
          mkdir dist
          zip "dist/play-lib-$TAG.zip" calc.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
          else
            # 点按钮时 tag 还不存在，--target 让它打在当前 commit 上
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
          fi

      - name: 通知 play-app
        if: github.event_name == 'push'   # 新增：只有推 tag 时才通知；总控触发时不通知
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: zouxianzhi-zxz/play-app
          event-type: lib-released
          client-payload: '{"lib_version": "${{ github.ref_name }}"}'